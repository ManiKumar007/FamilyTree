# Runs automatically when migration files are pushed to master.
# Also triggered manually via workflow_dispatch (useful for first-time setup).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com dashboard → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   — supabase.com dashboard → Project Settings → Database → Password
#
name: Database Migrations

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:               # allow manual run from GitHub Actions UI

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          supabase link --project-ref vojwwcolmnbzogsrmwap
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show migration status
        if: always()
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
